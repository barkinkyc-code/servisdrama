<!DOCTYPE html>

<head>

<body class="sales-body">

<script>
  // Token kontrol
  if (!localStorage.getItem('token')) {
    window.location.href = 'index.html';
  }
</script>

<!-- ═══ ÜST PANEL (tüm ekran genişliklerinde) ═══ -->
<header class="topbar" id="topbar">
  <img class="topbar-logo" id="topbarLogo" src="assets/email/servisdrama/drama-makine-logo.png" alt="Drama Makine" role="button" tabindex="0" title="Firmalarıma Git">

  <!-- Ana menü: masaüstünde satır içi, mobilde hamburger ile açılan panel -->
  <nav class="topbar-nav" id="navTabs">
    <button class="nav-tab" data-page="firmalar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Firmalarım
    </button>
    <button class="nav-tab" data-page="ziyaretler">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zm-5-5h3v3h-3zm-4-4h3v3h-3zm4 0h3v3h-3z"/></svg>
      Ziyaret Geçmişi
    </button>
    <button class="nav-tab" data-page="numuneler">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4 4h2v14h-2zm4-2h2v16h-2z"/></svg>
      Numuneler
    </button>
    <button class="nav-tab" data-page="ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ayarlar
    </button>
  </nav>

  <div class="topbar-right">
    <!-- Bildirim zilini notify-bell.js kurar (admin/teknisyen paneliyle ortak). -->
    <div class="nav-user-menu" id="navUserMenu">
      <div class="nav-avatar-btn" id="navAvatarBtn" onclick="toggleUserMenu(event)">
        <div class="nav-avatar-img" id="navAvatarImg"></div>
        <span class="topbar-username" id="navUserLabel"></span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round"/></svg>
      </div>
      <div class="nav-dropdown hidden" id="navDropdown">
        <div class="nav-dd-header">
          <div class="nav-dd-avatar" id="navDdAvatar"></div>
          <div>
            <div class="nav-dd-name" id="navDdName"></div>
            <div class="nav-dd-role">Satışçı · Sales</div>
          </div>
        </div>
        <div class="nav-dd-divider"></div>
        <button class="nav-dd-item red" onclick="doLogout()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Çıkış Yap
        </button>
      </div>
    </div>
    <button class="mobile-hamburger" id="mobileMenuBtn" type="button" aria-label="Menüyü aç" aria-controls="navTabs" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>
<div class="overlay-mobile" id="mobileOverlay"></div>

<!-- ═══ SOL PANEL (yalnızca masaüstü) ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-nav">
    <button class="nav-tab" data-page="firmalar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Firmalarım
    </button>
    <button class="nav-tab" data-page="ziyaretler">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zm-5-5h3v3h-3zm-4-4h3v3h-3zm4 0h3v3h-3z"/></svg>
      Ziyaret Geçmişi
    </button>
    <button class="nav-tab" data-page="numuneler">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4 4h2v14h-2zm4-2h2v16h-2z"/></svg>
      Numuneler
    </button>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-section-title">AYARLAR</div>
    <button class="nav-tab" data-page="ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ayarlar
    </button>
  </div>
</aside>

<!-- ═══ ANA İÇERİK ═══ -->
<main class="content" id="mainContent">
  <!-- Firmalarım — satışçının TEK çalışma ekranı.
       Eski "Dashboard" sekmesi buraya katlandı: KPI kartları + iki mini liste
       ile bu liste aynı firmaları iki ayrı yerde gösteriyordu. Artık sayılar
       filtre düğmesinin kendisi: rakama basınca liste o gruba iner. -->
  <section id="firmalarContent" class="page hidden">
    <div class="page-header">
      <h1>Firmalarım</h1>
      <p id="companiesSub">Size atanmış müşteriler</p>
    </div>
    <div class="content-body">
      <div id="salesChips" class="sls-chips"></div>
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg><input id="companySearch" placeholder="Firma ara..."></div>
      <div class="sls-list-hd">
        <span id="salesListTitle"></span>
        <button type="button" class="sls-sort" id="salesSortToggle"></button>
      </div>
      <div id="companiesList" class="co-list"></div>
      <p class="empty-state hidden" id="companiesEmpty">Firma bulunamadı.</p>
    </div>
  </section>

  <!-- Ziyaret Geçmişi Sekmesi -->
  <section id="ziyaretlerContent" class="page hidden">
    <div class="content-body">
      <div id="visitHistory" class="visit-history"></div>
    </div>
  </section>

  <!-- Numuneler Sekmesi -->
  <section id="numunelerContent" class="page hidden">
    <div class="page-header">
      <h1>Numuneler</h1>
      <p>Numune takip sistemi</p>
    </div>
    <div class="content-body">
      <button class="btn-add" id="sampleAddBtn" style="margin-bottom:16px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Numune Ekle</button>
      <div id="samplesList" class="samples-list"></div>
    </div>
  </section>

  <!-- Ayarlar Sekmesi -->
  <section id="ayarlarContent" class="page hidden">
    <div class="content-body">
      <div class="ay-hero">
        <div class="ay-avatar" id="ayAvatar"></div>
        <div class="ay-hero-info">
          <div class="ay-name" id="ayName"></div>
          <div class="ay-role">Satışçı · Sales</div>
          <div class="ay-badges">
            <span class="badge badge-blue" id="ayCodeBadge"></span>
            <span class="badge" id="ayStatusBadge"></span>
          </div>
        </div>
      </div>
      <div class="ay-grid">
        <div class="ay-card">
          <div class="ay-card-hd"><span class="ay-card-icon">👤</span>Profil Bilgileri</div>
          <div class="detail-grid" id="profileGrid"></div>
        </div>
        <div class="ay-card">
          <div class="ay-card-hd"><span class="ay-card-icon">🔒</span>Şifre Değiştir</div>
          <form id="passwordForm" class="pw-form">
            <div class="form-grp"><label class="form-lbl">Mevcut Şifre</label><input type="password" id="pwCurrent" class="inp" required autocomplete="current-password"></div>
            <div class="form-grp"><label class="form-lbl">Yeni Şifre</label><input type="password" id="pwNew" class="inp" required minlength="6" autocomplete="new-password"></div>
            <div class="form-grp"><label class="form-lbl">Yeni Şifre (Tekrar)</label><input type="password" id="pwConfirm" class="inp" required minlength="6" autocomplete="new-password"></div>
            <button type="submit" class="btn-add">Şifreyi Güncelle</button>
            <div id="pwMsg" class="pw-msg hidden"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ═══ Modal: Numune Ekle ═══ -->
<div id="sampleAddModal" class="sales-modal hidden">
  <div class="sales-modal-box">
    <div class="sales-modal-hd">
      <h2>Numune Ekle</h2>
      <button class="sales-modal-x" onclick="closeSampleAddModal()" aria-label="Kapat">×</button>
    </div>
    <div class="sales-modal-body">
      <form id="sampleAddForm">
        <div class="form-grp"><label class="form-lbl">Firma</label><select id="sampleCompany" class="inp" required></select></div>
        <div class="form-grp"><label class="form-lbl">Analiz Merkezi / Lab</label><input type="text" id="sampleLab" class="inp" placeholder="örn: İntertek" required></div>
        <div class="form-grp"><label class="form-lbl">Ürün / Numune (virgülle ayırın)</label><input type="text" id="sampleUrunler" class="inp" placeholder="örn: DRAMA KX-500, DRAMA HD-200" required></div>
        <div class="form-grp"><label class="form-lbl">Tarih</label><input type="date" id="sampleTarih" class="inp"></div>
        <div class="form-grp"><label class="form-lbl">Not (opsiyonel)</label><textarea id="sampleNot" class="inp" rows="2"></textarea></div>
        <button type="submit" class="btn-add" style="width:100%;">Numuneyi Kaydet</button>
        <div id="sampleAddMsg" class="pw-msg hidden"></div>
      </form>
    </div>
  </div>
</div>

<!-- Firma detayı: ayrı bir satışçı modalı YOK. #company360Modal'ı company-360.js
     kurar; admin ve teknisyenin gördüğü Firma 360° kartının aynısı açılır. -->

<div id="notifications" class="notifications-container"></div>

<script src="weekly-report-data.js?v=20260820-ortak-kart"></script>

</body>
</html>
